name = outlookSpeechFilter
summary = "Outlook Speech Filter - Mute message status verbosity and thread navigator"
description = "Mutes unwanted speech announcements (read/unread status, attachments, replied/forwarded, importance, external) in Microsoft Outlook message lists, replacing them with 10 discrete earcons. Features email conversation thread navigator (NVDA+F7 / NVDA+Alt+F7), next/previous email jumping (NVDA+Alt+Arrows), volume control, sound previews, group header cleaning, on-demand status reporting (NVDA+Shift+Z), contextual help (F1 / NVDA+Ctrl+Shift+H), and bilingual support."
author = "Sławomir Strugarek (with Antigravity)"
version = "1.18.1"
url = ""
minimumNVDAVersion = 2021.1.0
lastTestedNVDAVersion = "2026.1"
