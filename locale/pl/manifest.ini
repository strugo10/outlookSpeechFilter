summary = "Outlook - Filtr mowy i nawigator wątków wiadomości"
description = "Dodatek filtruje zbędne komunikaty mowy podczas poruszania się po liście wiadomości w programie Microsoft Outlook i zastępuje je dyskretnymi dźwiękami. Zawiera inteligentny nawigator wątków wiadomości (okno listy maili w wątku pod NVDA+F7 i NVDA+Alt+F7 z kopiowaniem pod Alt+K, szybkie skoki NVDA+Alt+Strzałki), 10 niezależnych przełączników dźwięków, suwak regulacji głośności (0-100%), odczyt statusów na żądanie (NVDA+Shift+Z), pomoc kontekstową (F1 oraz NVDA+Ctrl+Shift+H) i pełną dwujęzyczność."

